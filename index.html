<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" 
    />
    <title>West Side Tavern Portal</title>

    <!-- iOS PWA Standalone Mode & App Identity -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WST Portal" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Icons & Web Manifest -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // Prevent fatal domain error on localhost
        if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
          console.log("OneSignal push SDK bypassed on localhost");
          return;
        }

        try {
          await OneSignal.init({
            appId: "93cb91c7-7f6c-4f75-a66b-40a5fb5375f9",
            notifyButton: { enable: false }
          });
        } catch (e) {
          console.warn("OneSignal init error ignored:", e);
        }
      });
    </script>
  </head>
  <body class="bg-white text-black antialiased selection:bg-neutral-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
